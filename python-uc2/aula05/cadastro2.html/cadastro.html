<!DOCTYPE html>
<html lang="pt+BR>"
<head>
    <title>[MUDAR]</title>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale+1.0">
    <meta name="description" content="[MUDAR]">


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <style>
       .adicionar_borda{
            border-width: 1px;
            border-style: solid;
           border-color: black;
       }

    </style>



</head>
<!--FInal do head-->

<!--Inicio do body-->
<body class="bg-warning">

<!--Area principal dos site-->

<div id="div_principal" class="container bg-light">
    <!-- 
        Header da pagina
        [-]Logotipo
        [-]Tipo
        [-]Menu Principal
        [-]Login/Logout/Criar conta
    -->
    <!--Header da pagina-->

    <header class="adicionar_borda">
        <div class="row">
            <div class="col-12">
                Logo/Titulo
            </div>
        </div>

        <div class="row">
            <div class="col-9">
                    Menu Principal
            </div>
        
            <div class="col-3">
                    Login/Logout
            </div>
        </div>


    </header>

    <!--Main da pagina-->
    <main class="adicionar_borda">
        <!--formulario de cadastro-->
        <form action="cadastro/" method="get" target="_blank">
            
            <!--Nome Completo-->
            <div class="m-3">
                <label class="form-label"           
                    for="nome">NOME COMPLETO</label>
                <input class="form-control" type="text" id="nome" name="nome"
                required placeholder="Seu nome completo"
                title="informe seu nome completo (campo obrigatorio)">"
            </div>


            <!--E-mail de login-->
            <div class="m-3">
                <label for="nome">EMAIL</label>
                <input type="password" id="login" name="login"
                required placeholder=" password"
                title="informe seu LOGIN (campo obrigatorio)">"
            </div>

            <!--Senha-->
            <div class="m-3">
                <label for="nome">SENHA</label>
                <input type="text" id="senha" name="senha"
                required minlength="6"
                title="informe sua SENHA (campo obrigatorio)">"
            </div>

            <!--Confirmar Senha-->
            <div class="m-3">
                <label for="nome">SENHA</label>
                <input type="text" id="senha" name="senha"
                required minlength="6"
                title="informe sua SENHA (campo obrigatorio)">"
            </div>

            <!--CPF-->
            <div class="m-3">

                <label for="nome">CPF COMPLETO</label>
                <input type="text" id="senha" name="senha"
                placeholder="000.000.000-00"
                pattern="\d{3}\.d{3}\.d{3}-d{2}"
                title="Formato 000.000.000-00">
            </div>

          

            <!--CEP-->
            <div class="m-3">
                <label for="nome">CEP</label>
                <input type="text" id="cep" name="cep"
                required placeholder="CEP"
                title="informe seu nome CEP (campo obrigatorio)">"
            </div>

            <!--Logradouro-->
            <div class="m-3">
                <label for="nome">LOGRADOURO</label>
                <input type="text" id="LOGRADOURO" name="LOGRADOURO"
                required placeholder="Seu Logradouro"
                title="informe seu nome Logradouro (campo obrigatorio)">"
            </div>

            <!--complemento-->
            <div class="m-3">
                <label for="nome">COMPLEMENTO</label>
                <input type="text" id="COMPLEMENTO" name="COMPLEMENTO"
                required placeholder="Complemento"
                title="COMPLEMENTO">"
            </div>

            <!--Bairro-->
            <div class="m-3">
                <label for="nome">BAIRRO</label>
                <input type="text" id="BAIRRO" name="BAIRRO"
                required placeholder="BAIRRO"
                title="BAIRRO">"
            </div>

            <!--Cidade-->
            <div class="m-3">
                <label for="nome">CIDADE</label>
                <input type="text" id="CIDADE" name="CIDADE"
                required placeholder="CIDADE"
                title="CIDADE">"
            </div>

            <!--Estado-->
            <div class="m-3">
                <label for="nome">ESTADO</label>
                <input type="text" id="ESTADO" name="ESTADO"
                required placeholder="ESTADO"
                title="ESTADO">"
            </div>
     <!--Butoes-->

     <div class="m-3 row">
        <div class="col-6">
            <button type="submit"
            class="form-control btn btn-outline-primary">
            Enviar
        </button>
    </div>
    <div class="col-6">
            <button type="reset"
                class="form-control btn btn-outline-warning">
                Limpar
            </button>
        </div>
    </div>    


        </form>
        <!--Final do Form-->

    </main>
<!--
        [-]Menu secundario
        [-]contato
        [-]Copyright do site
        [-]Redes Sociais
        -->

    <!--footer da pagina-->
    <footer class="adicionar_borda">
        <div class="row">
            <div class="col-4">
                Menu Secundario
            </div>
            
            <div class="col-5">
                Contato <br>
                Copyright
            </div>

            <div class="col-3">
                <a href="https://github.com/luisrodrigonet/" 
                 target="blank" title="Acesse nosso Github">
                 

                    <i class="bi bi-github"></i>
                </a>
            </div>
        </div>    
    </footer>    
</div>

<!--Footer da pagina-->
    




    </footer>
</div>

<!-- final da Div principal-->


    <!-- Fim do footer do site-->

      <!-- Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>


</body>
</html>
